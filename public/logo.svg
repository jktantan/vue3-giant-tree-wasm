<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
>
  <title>VueGiantTree</title>
  <defs>
    <linearGradient id="gtNode" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f51d6" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="gtEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f51d6" stop-opacity="0.9" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0.55" />
    </linearGradient>
  </defs>

  <!-- 连接：根 → 2 → 4，逐层指数铺开 -->
  <g
    stroke="url(#gtEdge)"
    stroke-width="3.2"
    stroke-linecap="round"
    fill="none"
  >
    <path d="M32 12 L19 30" />
    <path d="M32 12 L45 30" />
    <path d="M19 30 L10 48" />
    <path d="M19 30 L25 48" />
    <path d="M45 30 L39 48" />
    <path d="M45 30 L54 48" />
  </g>

  <!-- 节点 -->
  <g fill="url(#gtNode)">
    <circle cx="32" cy="12" r="6.6" />
    <circle cx="19" cy="30" r="5" />
    <circle cx="45" cy="30" r="5" />
    <circle cx="10" cy="48" r="3.9" />
    <circle cx="25" cy="48" r="3.9" />
    <circle cx="39" cy="48" r="3.9" />
    <circle cx="54" cy="48" r="3.9" />
  </g>
</svg>
