# pnpm 9（两条 CI workflow 都固定用 version: 9）在解析 workspace 文件时要求
# `packages` 字段必须存在且非空，否则 `pnpm store path`——也就是 actions/setup-node
# 的 `cache: 'pnpm'` 会调用的那条命令——直接报 "packages field missing or empty"。
# 本地 pnpm 10+ 允许缺省，所以只在 CI 上暴露。
# 这里是单包仓库：根包即唯一成员，与 pnpm-lock.yaml 里的 `importers: .:` 对齐。
packages:
  - '.'

# 以下两项是 pnpm 10+ 的写法，用于放行依赖的构建脚本；pnpm 9 会忽略未知字段。
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
